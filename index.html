<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <!-- iPhone: instalar pela opção "Adicionar à Tela de Início" do Safari -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Personal">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <title>Personal Trainer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topo">
    <button id="btn-voltar" class="btn-icone" aria-label="Voltar" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <img id="marca" class="marca" src="logo.webp" alt="EG Gamer X">
    <h1 id="titulo">Personal Trainer</h1>
    <div id="topo-acao"></div>
  </header>

  <main id="tela"></main>

  <nav id="menu">
    <a href="#/" data-ir="#/" data-nav="/">
      <svg viewBox="0 0 24 24"><path d="M6.5 6v12M3.5 9v6M17.5 6v12M20.5 9v6M6.5 12h11"/></svg>Início</a>
    <a href="#/alunos" data-ir="#/alunos" data-nav="/alunos">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2.1.7 3.5 2.8 3.5 5.7"/></svg>Alunos</a>
    <a href="#/financeiro" data-ir="#/financeiro" data-nav="/financeiro">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9.2c-.5-1-1.6-1.7-3-1.7-1.8 0-3 .9-3 2.2 0 3 6 1.5 6 4.6 0 1.3-1.3 2.2-3 2.2-1.5 0-2.7-.7-3.2-1.8M12 5.5v2M12 16.5v2"/></svg>Financeiro</a>
    <a href="#/relatorios" data-ir="#/relatorios" data-nav="/relatorios">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Relatórios</a>
    <a href="#/config" data-ir="#/config" data-nav="/config">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Mais</a>
  </nav>

  <div id="modal-raiz" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="qr.js"></script>
  <script src="app.js"></script>
</body>
</html>
